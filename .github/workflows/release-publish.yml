name: release-publish

# SELF-TEST STUB for feed-repin.sh — mimics the shape of the real release-publish
# workflow: it runs on PRs (so the repin PR has checks) and on v* tags (so the
# tag-triggered publish path is exercised), and it publishes a release with the
# two assets feed-repin.sh insists on (SHA256SUMS + an aarch64 package).
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: checks
        run: echo "check passed on ${GITHUB_REF}"
      - name: publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          echo "stub" > out/SHA256SUMS
          echo "stub" > "out/tollgate-wrt-aarch64_cortex-a53.apk"
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "$GITHUB_REPOSITORY" --title "${GITHUB_REF_NAME}" --notes "self-test stub"
